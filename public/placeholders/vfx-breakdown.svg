<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">VFX breakdown placeholder</title>
  <desc id="desc">An original split-frame study reserved for a future before-and-after VFX breakdown.</desc>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1017"/>
      <stop offset="1" stop-color="#273444"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#140d10"/>
      <stop offset=".55" stop-color="#493126"/>
      <stop offset="1" stop-color="#c5a377"/>
